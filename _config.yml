# Site settings
title: Coding Hunter
tagline: AI · 编程语言 · DDD · 微服务
email: HTNecro@gmail.com
author: codinghunter
description: "Coding Hunter 是 codinghunter 的个人博客，记录 AI、编程语言、DDD（领域驱动设计）与微服务的实践与思考。"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://codinghunter.com" # 必须填写，sitemap / feed / 绝对链接都依赖它
lang: zh-CN
github_username: codinghunter

# Build settings
markdown: kramdown
theme: jekyll-whiteglass
plugins:
  - jekyll-archives
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/
paginate_path: /posts/:num/
paginate: 5

jekyll-archives:
  enabled:
    - categories
    - tags
  layout: category_archives
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# 评论系统已移除（Disqus 在国内不可用且免费版带广告）。
# 如需重新启用，推荐用 giscus（基于 GitHub Discussions）：
# 1) 在 _includes/custom_comments_provider.html 放入 giscus 脚本
# 2) 在 _layouts/post.html 里恢复 comments 区块，并把下面这行改回 true
comments: false

# 不要发布到站点里的文件（Gemfile / vendor 等已由 Jekyll 默认排除）
exclude:
  - README.md
  - LICENSE
