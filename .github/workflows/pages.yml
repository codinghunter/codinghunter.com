name: Build site

# 只负责「构建并发布产物」，站点怎么托管由使用者决定：
# 1) 跑 gh-pages 分支（GitHub Pages 或服务器 git fetch 拉取）
# 2) 打 tar.gz 传到 Release（标签为日期，同一天多次构建用 .1 .2 递增），服务器 curl 下载解压即可
# 两者是同一份 _site，不需要在服务器上再构建。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # 推 gh-pages / 写 Release 都需要

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ruby 版本取自仓库根目录的 .ruby-version
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          # CI 默认 UTC，会把 feed/sitemap/JSON-LD 里的时间写成 +00:00；固定时区保证与本地构建一致
          TZ: Asia/Shanghai

      # ---- 产物出口 A：gh-pages 分支 ----
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          # 产物目录里没有 Jekyll 源码，写 .nojekyll 让 Pages 别再跑一遍 Jekyll 3.9
          enable_jekyll: false
          # 每次部署生成单个提交，避免 gh-pages 历史无限膨胀（产物无可读 diff）
          force_orphan: true

      # ---- 产物出口 B：Release 附件 site.tar.gz（公开可直下，不需要 token）----
      - name: Package site
        run: tar -czf site.tar.gz -C _site .

      # 标签用日期，同一天多次构建用 .1 .2 递增（如 2026-11-02、2026-11-02.1）
      - name: Compute release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          day=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          seq=0
          while :; do
            tag="$day"
            if [ "$seq" -gt 0 ]; then tag="$day.$seq"; fi
            if gh release view "$tag" >/dev/null 2>&1; then
              seq=$((seq + 1))
            else
              break
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: 由 ${{ github.sha }} 构建的静态产物，解压到 Web 根目录即可，无需再构建。
          files: site.tar.gz
          make_latest: true

