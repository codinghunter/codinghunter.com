# 中文（简体）文案覆盖。
# 这里只保留本站用得到的部分：主题会用 site.data.i18n 覆盖自带数据文件，
# 因此需要覆盖时在这里补齐对应 key；
# 若站点新增其他语言，建议把主题自带的 en/de/ko/... 一并复制过来。
zh-CN:
  date:
    format: "%Y 年 %-m 月 %-d 日"
    abbr_day_names: ["周日", "周一", "周二", "周三", "周四", "周五", "周六"]
    abbr_month_names: ["1月", "2月", "3月", "4月", "5月", "6月",
      "7月", "8月", "9月", "10月", "11月", "12月"]
    day_names: ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"]
    month_names: ["一月", "二月", "三月", "四月", "五月", "六月",
      "七月", "八月", "九月", "十月", "十一月", "十二月"]
  morelink: "阅读全文"
  page-older: "较旧的文章"
  page-newer: "较新的文章"
  archive: "文章归档"
  archive-category: "分类「%1」"
  archive-tag: "标签「%1」"
  comments: "评论"
